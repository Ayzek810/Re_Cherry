appId: com.kangfenmao.CherryStudio
productName: Re_Cherry
electronLanguages:
  - zh-CN
  - zh-TW
  - en-US
  - ja # macOS/linux/win
  - ru # macOS/linux/win
  - zh_CN # for macOS
  - zh_TW # for macOS
  - en # for macOS
  - de
directories:
  buildResources: build

protocols:
  - name: Re_Cherry
    schemes:
      - cherrystudio
files:
  - "**/*"
  - "!**/{.vscode,.yarn,.yarn-lock,.github,.cursorrules,.prettierrc}"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!.*"
  - "!**/{.eslintignore,.eslintrc.js,.eslintrc.json,.eslintcache,root.eslint.config.js,eslint.config.js,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,eslint.config.mjs,CHANGELOG.md,README.md,biome.jsonc}"
  - "!**/{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!**/{tsconfig.json,tsconfig.tsbuildinfo,tsconfig.node.json,tsconfig.web.json}"
  - "!**/{.editorconfig,.jekyll-metadata}"
  - "!src"
  - "!patches"
  - "!**/node_modules/**/*.cpp"
  - "!**/node_modules/node-addon-api/**"
  - "!**/node_modules/prebuild-install/**"
  - "!scripts"
  - "!docs"
  - "!tools"
  - "!packages"
  - "!._*"
  - "!*.log"
  - "!*.md"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
  - "!**/*.{map,ts,tsx,jsx,less,scss,sass,css.d.ts,d.cts,d.mts,md,markdown,yaml,yml}"
  - "!**/{test,tests,__tests__,powered-test,coverage}/**"
  - "!**/{example,examples}/**"
  - "!**/*.{spec,test}.{js,jsx,ts,tsx}"
  - "!**/*.min.*.map"
  - "!**/*.d.ts"
  - "!**/dist/es6/**"
  - "!**/dist/demo/**"
  - "!**/amd/**"
  - "!**/{.DS_Store,Thumbs.db,thumbs.db,__pycache__}"
  - "!**/{LICENSE,license,LICENSE.*,*.LICENSE.txt,NOTICE.txt,README.md,readme.md,CHANGELOG.md}"
  - "!node_modules/rollup-plugin-visualizer"
  - "!**/*.{h,iobj,ipdb,tlog,recipe,vcxproj,vcxproj.filters,Makefile,*.Makefile}" # filter .node build files
  - "resources/**/*" # include all files in resources, and unpack them from asar for runtime access
asarUnpack:
  - out/proxy/**
  - resources/**
  - "**/*.{metal,exp,lib}"
  # LocalPaddle（文档处理通道 local-paddle）原生闭包显式解包（v0.4.4）：
  # .node 绑定 + 同目录 DLL 必须成组落在 app.asar.unpacked（Windows 无法从
  # asar 加载 DLL；onnxruntime_binding.node 静态依赖同目录 onnxruntime.dll，
  # sharp 同理）——v0.4.3 及之前 @img/sharp-win32-x64 整包缺失（pnpm 收集器
  # 对顶层可解析包的 optionalDependencies 存在性校验看不见 .pnpm 虚拟存储，
  # 静默丢弃），安装版 OCR 必死；scripts/after-pack.js 对此有交付断言。
  - "**/node_modules/onnxruntime-node/**"
  - "**/node_modules/@img/**"
  - "**/node_modules/sharp/**"
  - "**/node_modules/ppu-ocv/**"
  - "**/node_modules/ppu-paddle-ocr/**"

win:
  executableName: Re_Cherry
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  target:
    - target: nsis
    - target: portable
  signtoolOptions:
    sign: scripts/win-sign.js
  verifyUpdateCodeSignature: false
nsis:
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  allowToChangeInstallationDirectory: true
  oneClick: false
  include: build/nsis-installer.nsh
  buildUniversalInstaller: false
  differentialPackage: false
portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
  buildUniversalInstaller: false
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  artifactName: ${productName}-${version}-${arch}.${ext}
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  target:
    - target: dmg
    - target: zip
dmg:
  writeUpdateInfo: false
linux:
  artifactName: ${productName}-${version}-${arch}.${ext}
  executableName: CherryStudio
  target:
    - target: AppImage
    - target: deb
    - target: rpm
  maintainer: electronjs.org
  category: Utility
  desktop:
    entry:
      Name: Re_Cherry
      StartupWMClass: CherryStudio
  mimeTypes:
    - x-scheme-handler/cherrystudio
rpm:
  # Workaround for electron build issue on rpm package:
  # https://github.com/electron/forge/issues/3594
  fpm: ["--rpm-rpmbuild-define=_build_id_links none"]
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
beforePack: scripts/before-pack.js
afterPack: scripts/after-pack.js
afterSign: scripts/notarize.js
artifactBuildCompleted: scripts/artifact-build-completed.js
releaseInfo:
  releaseNotes: |
    <!--LANG:en-->
    Re_Cherry 0.5.2 - Pre-release cleanup, round 3

    The second full review produced 337 findings. Every finding now carries one terminal status.

    🛡️ Safety and correctness
    - The message-delete path reports a partial erasure. It no longer hides a failed disk delete.
    - The trace window subscribes to the language once. A reload no longer stacks duplicate sends.
    - The rich-editor toolbar keeps a stable hook order. It no longer breaks when the editor attaches late.
    - The notes editor keeps one save timer. A rename or a move no longer revives the old file path.
    - The knowledge-base search reports a failure as a failure. It no longer shows an empty list.
    - The Hermes dashboard start has no unreachable cancellation branch.
    - Dead surfaces are gone: the API-gateway lease trio, the always-false lifecycle flag, and one unused helper.

    ⚡ Performance
    - Each message block and each code block subscribes to its own settings fields. A settings change no longer re-renders the whole message tree.
    - One Shiki language chunk per language. The duplicate set is gone (-4.14 MB, 309 files).
    - The first paint no longer runs the Notion client or the OpenTelemetry web trace.
    - First-paint payload: 12.782 MB to 12.368 MB.

    <!--LANG:zh-CN-->
    Re_Cherry 0.5.2 - 正式版前的第三轮整理

    第二轮全量审查共 337 条发现，现已逐条给出终局结论（修复 / 复核不成立 / 有意保留）。

    🛡️ 安全与正确性
    - 消息删除路径会如实报告「部分数据仍在磁盘上」，不再把落盘失败藏起来。
    - trace 窗口的语言订阅只挂一次；重新加载不再叠加重复推送。
    - 富文本工具栏的 Hook 顺序固定，编辑器晚到时不再崩。
    - 笔记编辑器只保留一个保存定时器；改名或移动后不会按旧路径把文件复活。
    - 知识库检索把失败如实报为失败，不再显示成「没有结果」。
    - Hermes 面板启动路径里不可达的取消分支已删除。
    - 清理死表面：API 网关的租约三件套、恒 false 的生命周期字段、一个零调用的工具函数。

    ⚡ 性能
    - 每个消息块与代码块只订阅自己用到的设置字段；改一次设置不再重渲染整棵消息树。
    - 每种语言只留一份 Shiki chunk，重复副本消除（-4.14 MB，309 个文件）。
    - 首屏不再执行 Notion 客户端与 OpenTelemetry web trace。
    - 首屏载荷 12.782 MB → 12.368 MB。

    <!--LANG:en-->
    Re_Cherry 0.5.1 - Pre-release cleanup, round 2

    A second full review produced 336 findings. This release fixes the open high-severity items.

    🛡️ Safety and correctness
    - The session sweep no longer deletes a session that exists but cannot be read.
    - The backup restore moves the old directory aside first. A failed restore keeps the backup.
    - Four tools report a total source failure as a failure, not as "no results".
    - The web-search source update keeps the sources you did not select.
    - The health check no longer shows a total failure as "0/N passed".
    - A programmatic edit in the notes editor no longer gets discarded or silently reverted.
    - The MCP server command is validated before spawn. Bare names like node and python resolve correctly.

    ⚡ Performance
    - Stable-prefix streaming: the Markdown pipeline runs twice per reply instead of once per frame.
    - The reply text writes to Redux as a delta, not as the whole text.
    - The Notion export loads on demand.
    - First-paint payload: 12.502 MB to 12.184 MB.

    <!--LANG:zh-CN-->
    Re_Cherry 0.5.1 - 正式版前的第二轮整理

    第二轮全量审查产出 336 条发现，本版修复其中的高严重度未闭环项。

    🛡️ 安全与正确性
    - 启动清扫不再物理删除「存在但读不出来」的会话。
    - 备份还原改为先把旧目录挪开；还原失败保留备份。
    - 四个工具把「数据源全部失败」如实报为失败，不再说成「没有结果」。
    - 更新搜索订阅源时，未选中的订阅源不再丢失。
    - 健康检查不再把整体失败显示成「0/N 通过」。
    - 笔记编辑器的程序化写入不再被丢弃或被静默还原。
    - MCP 服务器命令在 spawn 前校验；node、python 这类裸名现在能正确解析。

    ⚡ 性能
    - 流式稳定前缀复用：Markdown 管线每次回复只跑 2 次，而非每帧 1 次。
    - 正文写 Redux 改为增量，不再每帧写全文。
    - Notion 导出改为按需加载。
    - 首屏载荷 12.502 MB → 12.184 MB。

    <!--LANG:en-->
    Re_Cherry 0.5.0 - Pre-release cleanup, round 1

    Full code review, performance work and cleanup before the official release.

    ⚡ Performance
    - Route-level code splitting: first-paint JS payload dropped from 21.3 MB to 14.1 MB (-33%).
    - MathJax loads only when the MathJax math engine is selected (KaTeX is the default).
    - Removed a bundle leak that pulled the PDF-parsing stack into the renderer; Excel export now loads on demand.
    - The trace window no longer polls the DOM 10 times per second.

    🐛 Fixes
    - In-place translation could create a duplicate translation block after a restart.
    - Obsidian export used a stale topic name after renaming a topic.
    - The MCP dependency page always reported "missing dependencies"; it now reports the real PATH status of npx/uvx.

    🧹 Cleanup
    - 257 unused translation keys removed; lint warnings across the repository reduced to zero.

    <!--LANG:zh-CN-->
    Re_Cherry 0.5.0 - 正式版前的第一轮整理

    正式上线前的全量代码审查、性能优化与清理。

    ⚡ 性能
    - 路由级代码分割：首屏 JS 载荷由 21.3MB 降至 14.1MB（-33%）。
    - MathJax 仅在选择 MathJax 数学引擎时加载（默认引擎为 KaTeX）。
    - 修复把 PDF 解析栈拖入渲染层的打包泄漏；Excel 导出改为按需加载。
    - trace 窗不再以每秒 10 次的频率轮询 DOM。

    🐛 修复
    - 消息级翻译在重启后可能重复创建翻译块。
    - 话题改名后导出到 Obsidian 仍使用旧名。
    - MCP 依赖页此前恒显示「依赖缺失」，现如实呈现 npx/uvx 在系统 PATH 中的状态。

    🧹 清理
    - 删除 257 个无用文案键；全仓 lint 警告清零。
    <!--LANG:END-->

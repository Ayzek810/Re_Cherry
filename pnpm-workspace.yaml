packages:
  - 'packages/*'

supportedArchitectures:
  os:
  - current
  cpu:
  - current

# v0.2.4-1：原 package.json 的 "pnpm" 字段已迁移到此处。
# pnpm 10.6+ 起设置只从 pnpm-workspace.yaml（或全局 config.yaml）读取；
# 留在 package.json 的 "pnpm" 字段会被忽略（pnpm 11 起彻底不再读取），
# 一旦 lockfile 被重建，overrides / patchedDependencies 会静默失效
# （其中 libsql 补丁关系到 win32-arm64 原生解析、file-stream-rotator 关系到日志轮转）。
overrides:
  'basic-ftp': '>=5.2.0'
  'fast-xml-parser': '>=5.3.6'
  'minimatch@<3.1.3': '3.1.5'
  'minimatch@>=5.0.0 <5.1.7': '5.1.7'
  'minimatch@>=9.0.0 <9.0.6': '9.0.6'
  'minimatch@>=10.0.0 <10.2.1': '10.2.1'
  '@smithy/types': '4.7.1'
  '@codemirror/state': '6.5.4'
  '@codemirror/view': '6.39.16'
  '@codemirror/language': '6.12.2'
  '@codemirror/lint': '6.9.5'
  '@lezer/common': '1.5.1'
  'esbuild': '^0.25.0'
  'node-abi': '4.28.0'
  'openai': 'npm:@cherrystudio/openai@6.15.0'
  'tar-fs': '^2.1.4'
  'undici': '6.23.0'
  'vite': 'npm:rolldown-vite@7.3.0'
  '@ai-sdk/provider-utils': '4.0.23'

patchedDependencies:
  'antd@5.27.0': patches/antd-npm-5.27.0-aa91c36546.patch
  'atomically@1.7.0': patches/atomically-npm-1.7.0-e742e5293b.patch
  'file-stream-rotator@0.6.1': patches/file-stream-rotator-npm-0.6.1-eab45fb13d.patch
  'libsql@0.4.7': patches/libsql-npm-0.4.7-444e260fb1.patch

onlyBuiltDependencies:
  - '@kangfenmao/keyv-storage'
  - '@scarf/scarf'
  - '@swc/core'
  - 'electron'
  - 'electron-winstaller'
  - 'esbuild'
  - 'msw'
  - 'protobufjs'
  - 'registry-js'
  - 'zipfile'
